<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTthon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- logo -->
         <div class="logo">
            <img src="assets/logo.svg" alt="logo">
         </div>

         <!-- home-icon -->
          <div class="icon home-icon">
                <img src="assets/home-icon.svg" alt="home-icon">
          </div>

          <!-- tools-icon -->
           <div class="icon tools-icon">
                <img src="assets/tools.svg" alt="tools-icon">
           </div>

          <!-- tools-icon -->
           <div class="icon tools-icon">
                <img src="assets/tools.svg" alt="tools-icon">
           </div>

          <!-- notify-icon -->
           <div class="icon notify-icon">
                <img src="assets/notify.svg" alt="notify-icon">
                <img class="image2" src="assets/notify-ellipse.svg" alt="notify-icon">
           </div>

           <!-- profile-icon -->
           <div class="icon profile-icon">
                <img src="assets/profile-icon.png" alt="profile-icon">
           </div>

           <div class="menu-dot menu-dot1"></div>
           <div class="menu-dot menu-dot2"></div>
           <div class="menu-dot menu-dot3"></div>
    </header>


    <main>
        <div class="left">
            <div class=".left box1"></div>

            <div class=".left box2"></div>
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
