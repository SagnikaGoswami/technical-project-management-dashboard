<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTthon</title>
    <link rel="stylesheet" href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- collapsed journey board -->
    <header>
        <div class="wrapper">
            <nav>
                <div class="logo">
                    <img src="assets/logo.svg" alt="nav-logo">
                </div>

                <div class="right">
                    <div class="one">
                        <img class="home-icon" src="assets/home.svg" alt="home">
                    </div>
                    <div class="two">
                        <img class="tools-icon" src="assets/tools.svg" alt="tools">
                    </div>
                    <div class="three">
                        <img class="notification-icon" src="assets/notify.png" alt="notification">
                        <img src="assets/Ellipse 55.png" alt="ellipse">
                    </div>
                </div>
                
            </nav>
        </div>
    </header>


    <script src="script.js"></script>
</body>
</html>
