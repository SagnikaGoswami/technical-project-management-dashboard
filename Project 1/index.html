<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTthon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- header -->
    <header>
        <div class="logo">
            <img src="assets/logo.svg" alt="logo">
        </div>

        <!-- <div class="icons"> -->
            <div class="icon home">
                <img src="assets/home-icon.svg" alt="home-icon">
            </div>

            <div class="icon tools">
                <img src="assets/tools.svg" alt="tools-icon">
            </div>

                <img class="image1" src="assets/notify.svg" alt="notify-icon">
                <img class="image2" src="assets/notify-ellipse.svg" alt="notify-icon">
            </div>

            <div class="icon profile">
                <img src="assets/profile-icon.png" alt="profile-icon">
            </div>

            <div class="icon-el dots">
                <div class="dot dot1"></div>
                <div class="dot dot2"></div>
                <div class="dot dot3"></div>
            </div>
        <!-- </div> -->
    </header>


    <!-- main -->
    <main>
        <div class="left">

            <div class=".left box1">
                <img src="assets/left_arrow.svg" alt="arrow">
            </div>


            <div class=".left box2">
                <div class="inner-box">
                    
                </div>
            </div>

        </div>
    </main>


    <script src="script.js"></script>
</body>

</html>
